# Configuracao das fontes rastreadas.
#
# Cada fonte e uma pagina (HTML) ou um feed (RSS/Atom) que sera baixada a cada
# execucao. O rastreador extrai TODOS os links da pagina e mantem apenas os que
# passam nos filtros de palavras-chave. Isso e proposital: nao dependemos de
# seletores CSS especificos, que quebram sempre que o site muda de layout.
#
# Campos de cada fonte:
#   nome       -> rotulo usado no e-mail
#   url        -> endereco a ser baixado
#   tipo       -> "html" ou "rss"
#   categoria  -> "mestrado" ou "concurso" (usado para agrupar o e-mail)
#   ativa      -> false desliga a fonte sem apagar a configuracao
#   filtros    -> sobrescreve os filtros padrao da categoria (opcional)
#
# Filtros (todos opcionais, combinaveis):
#   grupos   -> lista de listas. Dentro de um grupo basta UMA palavra casar,
#               mas TODOS os grupos precisam casar. E o filtro principal.
#   qualquer -> o texto precisa conter pelo menos uma destas palavras
#   todas    -> o texto precisa conter todas estas palavras
#   excluir  -> se contiver qualquer uma destas, o link e descartado
# A comparacao ignora maiusculas e acentos, e olha o titulo e a URL do link.

padroes:
  # Um item so vira aviso se casar com TODOS os grupos: precisa ter uma palavra
  # de acao (algo foi publicado/aberto) E uma palavra de assunto (e sobre o que
  # voce quer). Isso barra os itens de menu dos sites, que tem o assunto
  # ("Programas de Pos-Graduacao", "Promotorias de Justica") mas nunca a acao.
  mestrado:
    grupos:
      - # acao
        - edital
        - processo seletivo
        - processos seletivos
        - inscricoes
        - inscricao
        - chamada publica
        - selecao de candidatos
        - vagas
        - abertas
        - prorrog
      - # assunto
        - mestrado
        - pos-graduacao
        - pos graduacao
        - posgraduacao
        - stricto sensu
        - ppg
    excluir:
      - resultado final
      - resultado preliminar
      - homologacao do resultado
      - retificacao do resultado
      - convocacao para matricula
      - iniciacao cientifica
      - graduacao sanduiche
      - lato sensu
      - especializacao

  concurso:
    grupos:
      - # acao
        - edital
        - concurso
        - inscricoes
        - inscricao
        - abre
        - abertas
        - publica
        - lanca
        - autoriza
        - retifica
        - prorrog
        - vagas
        - processo seletivo
      - # assunto: cargos e areas de formacao em Direito
        - direito
        - juridic
        - advogad
        - procurador
        - defensor
        - promotor
        - magistratura
        - juiz
        - delegado
        - escriva
        - oficial de justica
        - analista judiciario
        - tecnico judiciario
        - analista processual
        - ministerio publico
        - defensoria
        - tribunal
        - oab
    excluir:
      - resultado final
      - resultado preliminar
      - gabarito
      - apostila
      - curso preparatorio
      - simulado
      - como passar
      - direitos reservados
      - todos os direitos

fontes:
  # Estado verificado em 26/08/2026 rodando o diagnostico em producao.
  # As fontes marcadas "confirmada" foram vistas devolvendo editais de verdade.

  # ------------------------------------------------------------------
  # Mestrado - UFG (Goias)
  # ------------------------------------------------------------------
  - nome: UFG - Pro-Reitoria de Pos-Graduacao (PRPG)
    url: https://prpg.ufg.br/
    tipo: html
    categoria: mestrado
    ativa: true    # confirmada: rendeu 5 editais ("PPGS abre vagas para mestrado")

  - nome: UFG - Faculdade de Direito
    url: https://direito.ufg.br/
    tipo: html
    categoria: mestrado
    ativa: true    # so tinha menu no teste, mas publica noticias; fica ligada

  # ------------------------------------------------------------------
  # Mestrado - UnB (Brasilia)
  # ------------------------------------------------------------------
  - nome: UnB - Noticias institucionais
    url: https://noticias.unb.br/
    tipo: html
    categoria: mestrado
    ativa: true    # confirmada: publica noticias como links de verdade

  # Testada: 70 links, todos de menu institucional. Os editais ficam no PPGD.
  - nome: UnB - Faculdade de Direito
    url: https://fd.unb.br/
    tipo: html
    categoria: mestrado
    ativa: false

  - nome: UnB - Pos-Graduacao em Direito (PPGD)
    url: https://ppgd.unb.br/
    tipo: html
    categoria: mestrado
    ativa: true    # confirmada: a melhor fonte da UnB. Achou "Processo Seletivo
                   # 2026/2" e "EDITAL DPG/UnB No 08/2026 - BOLSAS DE MESTRADO"

  # O Decanato de Pos-Graduacao (dpg.unb.br/editais-de-selecao) foi testado e
  # nao serve: a pagina devolve 131 links, todos de menu. A lista de editais
  # e montada por JavaScript, entao nao existe no HTML que o rastreador le.
  - nome: UnB - Decanato de Pos-Graduacao (editais de selecao)
    url: https://dpg.unb.br/editais-de-selecao
    tipo: html
    categoria: mestrado
    ativa: false

  # ------------------------------------------------------------------
  # Mestrado - demais federais no DF / entorno
  # ------------------------------------------------------------------
  - nome: IFB - Editais (Instituto Federal de Brasilia)
    url: https://www.ifb.edu.br/editais
    tipo: html
    categoria: mestrado
    ativa: false   # ligue se quiser acompanhar tambem o IFB

  # ------------------------------------------------------------------
  # Concursos para formados em Direito
  # ------------------------------------------------------------------
  - nome: PCI Concursos - ultimas noticias
    url: https://www.pciconcursos.com.br/noticias/
    tipo: html
    categoria: concurso
    ativa: true    # confirmada: a melhor fonte, 4 vagas juridicas de uma vez

  - nome: PCI Concursos - vagas de nivel superior
    url: https://www.pciconcursos.com.br/concursos/nivelsuperior/
    tipo: html
    categoria: concurso
    ativa: true    # confirmada

  - nome: JC Concursos (feed)
    url: https://jcconcursos.com.br/feed
    tipo: rss
    categoria: concurso
    ativa: true    # confirmada

  - nome: Concursos no Brasil (feed)
    url: https://www.concursosnobrasil.com.br/feed/
    tipo: rss
    categoria: concurso
    ativa: true    # feed responde; naquele dia nao tinha vaga juridica

  # Testada duas vezes: 94 links, todos de menu e rodape. A pagina de concursos
  # do MPDFT nao expoe os editais no HTML. O PCI e o JC noticiam esses concursos.
  - nome: MPDFT - Concursos
    url: https://www.mpdft.mp.br/portal/index.php/concursos-menu
    tipo: html
    categoria: concurso
    ativa: false

  - nome: TJDFT - Portal
    url: https://www.tjdft.jus.br/
    tipo: html
    categoria: concurso
    ativa: true    # confirmada: achou "Juiz de Direito Substituto" e afins

  - nome: Cebraspe - Concursos
    url: https://www.cebraspe.org.br/concursos/
    tipo: html
    categoria: concurso
    ativa: false   # pagina montada por JavaScript: o rastreador ve 0 links
