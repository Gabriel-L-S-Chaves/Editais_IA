# Configuracao das fontes rastreadas.
#
# Cada fonte e uma pagina (HTML) ou um feed (RSS/Atom) que sera baixada a cada
# execucao. O rastreador extrai TODOS os links da pagina e mantem apenas os que
# passam nos filtros de palavras-chave. Isso e proposital: nao dependemos de
# seletores CSS especificos, que quebram sempre que o site muda de layout.
#
# Campos de cada fonte:
#   nome       -> rotulo usado no e-mail
#   url        -> endereco a ser baixado
#   tipo       -> "html" ou "rss"
#   categoria  -> "mestrado" ou "concurso" (usado para agrupar o e-mail)
#   ativa      -> false desliga a fonte sem apagar a configuracao
#   filtros    -> sobrescreve os filtros padrao da categoria (opcional)
#
# Filtros:
#   qualquer -> o texto do link precisa conter PELO MENOS UMA destas palavras
#   todas    -> o texto precisa conter TODAS estas palavras
#   excluir  -> se contiver qualquer uma destas, o link e descartado
# A comparacao ignora maiusculas e acentos.

padroes:
  mestrado:
    qualquer:
      - edital
      - processo seletivo
      - selecao
      - inscricoes
      - inscricao
      - mestrado
      - pos-graduacao
      - stricto sensu
    todas: []
    excluir:
      - resultado final
      - homologacao do resultado
      - retificacao do resultado
      - convocacao para matricula
      - iniciacao cientifica
      - graduacao sanduiche

  concurso:
    qualquer:
      - direito
      - juridic
      - advogad
      - procurador
      - defensor
      - promotor
      - magistratura
      - juiz
      - delegado
      - analista judiciario
      - tecnico judiciario
      - oficial de justica
      - assessor juridico
      - escriva
      - ministerio publico
      - tribunal
      - oab
    todas: []
    excluir:
      - resultado final
      - gabarito
      - apostila
      - curso preparatorio
      - simulado

