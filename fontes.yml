# Configuracao das fontes rastreadas.
#
# Cada fonte e uma pagina (HTML) ou um feed (RSS/Atom) que sera baixada a cada
# execucao. O rastreador extrai TODOS os links da pagina e mantem apenas os que
# passam nos filtros de palavras-chave. Isso e proposital: nao dependemos de
# seletores CSS especificos, que quebram sempre que o site muda de layout.
#
# Campos de cada fonte:
#   nome       -> rotulo usado no e-mail
#   url        -> endereco a ser baixado
#   tipo       -> "html" ou "rss"
#   categoria  -> "mestrado" ou "concurso" (usado para agrupar o e-mail)
#   ativa      -> false desliga a fonte sem apagar a configuracao
#   filtros    -> sobrescreve os filtros padrao da categoria (opcional)
#
# Filtros (todos opcionais, combinaveis):
#   grupos   -> lista de listas. Dentro de um grupo basta UMA palavra casar,
#               mas TODOS os grupos precisam casar. E o filtro principal.
#   qualquer -> o texto precisa conter pelo menos uma destas palavras
#   todas    -> o texto precisa conter todas estas palavras
#   excluir  -> se contiver qualquer uma destas, o link e descartado
# A comparacao ignora maiusculas e acentos, e olha o titulo e a URL do link.

padroes:
  # Um item so vira aviso se casar com TODOS os grupos: precisa ter uma palavra
  # de acao (algo foi publicado/aberto) E uma palavra de assunto (e sobre o que
  # voce quer). Isso barra os itens de menu dos sites, que tem o assunto
  # ("Programas de Pos-Graduacao", "Promotorias de Justica") mas nunca a acao.
  mestrado:
    grupos:
      - # acao
        - edital
        - processo seletivo
        - processos seletivos
        - inscricoes
        - inscricao
        - chamada publica
        - selecao de candidatos
        - vagas
        - abertas
        - prorrog
      - # assunto
        - mestrado
        - pos-graduacao
        - pos graduacao
        - posgraduacao
        - stricto sensu
        - ppg
    excluir:
      - resultado final
      - resultado preliminar
      - homologacao do resultado
      - retificacao do resultado
      - convocacao para matricula
      - iniciacao cientifica
      - graduacao sanduiche
      - lato sensu
      - especializacao

  concurso:
    grupos:
      - # acao
        - edital
        - concurso
        - inscricoes
        - inscricao
        - abre
        - abertas
        - publica
        - lanca
        - autoriza
        - retifica
        - prorrog
        - vagas
        - processo seletivo
      - # assunto: cargos e areas de formacao em Direito
        - direito
        - juridic
        - advogad
        - procurador
        - defensor
        - promotor
        - magistratura
        - juiz
        - delegado
        - escriva
        - oficial de justica
        - analista judiciario
        - tecnico judiciario
        - analista processual
        - ministerio publico
        - defensoria
        - tribunal
        - oab
    excluir:
      - resultado final
      - resultado preliminar
      - gabarito
      - apostila
      - curso preparatorio
      - simulado
      - como passar

